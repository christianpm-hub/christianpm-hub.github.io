<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <button type="button" class="request">Generate new one</button>
        <div class="activity"></div>
    </center>
    <script>
        document.querySelector(".request").addEventListener("click", event => {
            requestActivity();
        });

        function requestActivity() {
            // URL alternativa activa con la misma estructura de datos
            const url = "https://www.boredapi.com/api/activity/";
            const http = new XMLHttpRequest();

            http.open("GET", url);

            http.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    insertOutputResponse(this.response);
                }
            };

            http.send();
        }

        function insertOutputResponse(response) {
            let decodedResponse = JSON.parse(response);
            let container = document.querySelector(".activity");

            container.innerHTML = "";

            // Corregido: createElement en vez de createComment
            let activity = document.createElement("h4");
            activity.append(decodedResponse.activity);
            container.append(activity);

            // Solo creamos el enlace si la actividad trae uno
            if (decodedResponse.link) {
                let link = document.createElement("a");
                link.href = decodedResponse.link;
                link.text = decodedResponse.link;
                link.target = "_blank";
                container.append(link);
            }

            let type = document.createElement("p");
            type.append(decodedResponse.type);
            container.append(type);
        }
    </script>
</body>
</html>
